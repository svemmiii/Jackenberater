name: Validate

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python -m pip install --upgrade pip pytest pytest-asyncio ruff
      - run: python -m compileall -q custom_components tests
      - run: ruff check --select F,E9 custom_components tests
      - run: pytest -q tests --ignore=tests/ha_runtime
      - run: node --check custom_components/jackenberater/frontend/jackenberater-card.js
      - run: node tests/frontend-session.test.js

  ha-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip pytest-homeassistant-custom-component==0.13.363
      - run: python -m pytest -q tests/ha_runtime

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned because this action intentionally has no stable release tag.
      - uses: home-assistant/actions/hassfest@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@22.5.0
        with:
          category: integration
